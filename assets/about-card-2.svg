<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="566" height="366" viewBox="-3 -3 566 366"><g font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#ffffff"><rect x="1" y="1" width="558" height="330" rx="6" fill="none" style="stroke:#24292f;stroke-opacity:0.8;stroke-width:3.5;stroke-dasharray:11.5 4;stroke-dashoffset:1"/><rect x="1" y="1" width="558" height="330" rx="6" fill="#000000" fill-opacity="0.5" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="9.5 6"/><text x="280" y="30" text-anchor="middle">About me</text><line x1="1" y1="44" x2="559" y2="44" style="stroke:#24292f;stroke-opacity:0.8;stroke-width:3.5;stroke-dasharray:11.5 4;stroke-dashoffset:1"/><line x1="1" y1="44" x2="559" y2="44" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="9.5 6"/><text x="24" y="70" textLength="510" lengthAdjust="spacing">I am Bagas, an IT student at Gunadarma University</text><text x="24" y="92" textLength="510" lengthAdjust="spacing">(started in 2024). I like figuring out how things work</text><text x="24" y="114" textLength="510" lengthAdjust="spacing">and making them a bit better, whether it is a</text><text x="24" y="136">workflow, a tool, or a website.</text><text x="24" y="169" textLength="510" lengthAdjust="spacing">I mostly learn by doing. I run a small homelab at</text><text x="24" y="191" textLength="510" lengthAdjust="spacing">home, use AdGuard Home and Pi-hole on my network, and</text><text x="24" y="213">have tried a few Linux distros along the way.</text><text x="24" y="246" textLength="510" lengthAdjust="spacing">I am also curious about how AI tools fit into everyday</text><text x="24" y="268" textLength="510" lengthAdjust="spacing">work. I do some design in Figma and Canva, and I like</text><text x="24" y="290" textLength="510" lengthAdjust="spacing">building small interactive websites, like the ones for</text><text x="24" y="312">my course presentations.</text></g></svg>
